type Folder {
  id: ID!
  name: String!
  createdAt: String!
  bookmarks: [Bookmark!]
}

type Bookmark {
  id: ID!
  title: String!
  url: String!
  tags: [String!]!
  folderId: ID!
  createdAt: String!
  folder: Folder!
}

type BookmarkConnection {
  nodes: [Bookmark!]!
  nextCursor: String
  hasNextPage: Boolean!
}

type Query {
  folders: [Folder!]!
  folder(id: ID!): Folder
  bookmarks(
    folderId: ID
    search: String
    take: Int
    cursor: String
  ): BookmarkConnection!
}

type Mutation {
  createFolder(name: String!): Folder!
  
  createBookmark(
    folderId: ID!
    title: String!
    url: String!
    tags: [String!]
  ): Bookmark!
  
  updateBookmark(
    id: ID!
    title: String
    url: String
    tags: [String!]
  ): Bookmark!
  
  deleteBookmark(id: ID!): Bookmark!
  
  moveBookmark(
    id: ID!
    folderId: ID!
  ): Bookmark!
}
